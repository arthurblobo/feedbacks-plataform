<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeWork-Analysys</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="cabecalho">
        <h1>Feedback atividades</h1>
        <h3>Envie as fotos das atividades</h3>
   </div>
   <div class="escopo-transcricao">
        <h4>Tema da atividade</h4>
        <input id="tema" type="text" placeholder="Digite o tema da atividade">
         <h4>Conteúdo cobrado</h4>
         <textarea id="conteudo" placeholder="Digite o conteúdo cobrado na atividade"></textarea>
         <h4>Fotos ou PDF das atividades</h4>
        <input type="file" id="fotos" accept="image/*,application/pdf" multiple>
         <button id="btn-transcrever">Transcrever</button>
   </div>
   <div id="res-transcricao">

   </div>
   <div class="escopo-geracao">
        <h2>Confira a transcrição</h2>
        <h4>Corrija o que estiver errado antes de gerar os feedbacks.</h4>
         <button id="btn-gerar-feedbacks">Gerar feedbacks</button>
   </div>
   <div class="feedbacks-gerados">
        <h2>Feedbacks</h2>
   </div>
   <script>
        function redimensionarImagem(arquivo, larguraMaxima, alturaMaxima) {
  return new Promise ((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        let largura = img.width;
        let altura = img.height;

        if (largura > larguraMaxima || altura > alturaMaxima) {
          const proporcao = Math.min(larguraMaxima / largura, alturaMaxima / altura);
          largura *= proporcao;
          altura *= proporcao;
        }

        const canvas = document.createElement("canvas");
        canvas.width = largura;
        canvas.height = altura;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, largura, altura);
        resolve(canvas.toDataURL(arquivo.type));
      };
      img.src = event.target.result;
    };
    reader.onerror = (error) => reject(error);
    reader.readAsDataURL(arquivo);
  });
}

function lerArquivoComoBase64(arquivo) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(arquivo);
    });
}

function linhasDaTabelaMarkdown(texto) {
    return texto
        .trim()
        .split("\n")
        .map(linha => linha.split("|").map(celula => celula.trim()).filter(c => c !== ""))
        .filter(colunas => colunas.length >= 3)
        .filter(colunas => !/^-+$/.test(colunas[0]))
        .filter(colunas => colunas[0].toLowerCase() !== "nome")
        .map(colunas => ({
            nome: colunas[0],
            questao: colunas[1],
            respostaAluno: colunas[2]
        }));
}

function criarTabelaHtml(alunos) {
    const linhas = alunos.map(aluno => `
        <tr>
            <td contenteditable="true">${aluno.nome}</td>
            <td contenteditable="true">${aluno.questao}</td>
            <td contenteditable="true">${aluno.respostaAluno}</td>
        </tr>
    `).join("");

    return `
        <table>
            <tr><th>Nome</th><th>Questão</th><th>O que o aluno escreveu</th></tr>
            ${linhas}
        </table>
    `;
}

function tabelaParaMarkdown(alunos) {
    const cabecalho = "Nome | Questão | O que o aluno escreveu";
    const linhas = alunos.map(a => `${a.nome} | ${a.questao} | ${a.respostaAluno}`);
    return [cabecalho, ...linhas].join("\n");
}

document.getElementById("btn-transcrever")
.addEventListener("click", async (evento) => {
    const botao = evento.target;
    botao.disabled = true;
    botao.textContent = "Transcrevendo...";

    try {
        const arquivos = Array.from(document.getElementById("fotos").files);
        const todosOsAlunos = [];

        for (let i = 0; i < arquivos.length; i++) {
            document.getElementById("res-transcricao").textContent = `Enviando ${i + 1} de ${arquivos.length}...`;

            const ehPdf = arquivos[i].type === "application/pdf";
            const conteudo = ehPdf
                ? await lerArquivoComoBase64(arquivos[i])
                : await redimensionarImagem(arquivos[i], 800, 600);
            const reposta = await fetch("/transcrever", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    tema: document.getElementById("tema").value,
                    conteudo: document.getElementById("conteudo").value,
                    foto: {
                        nome: arquivos[i].name,
                        tipo: arquivos[i].type,
                        tamanho: arquivos[i].size,
                        conteudo: conteudo
                    }
                })
            });
            const dados = await reposta.json();
            if (!reposta.ok) {
                throw new Error(dados.erro || "Falha ao transcrever a imagem.");
            }
            todosOsAlunos.push(...linhasDaTabelaMarkdown(dados.tabela));
        }

        document.getElementById("res-transcricao").innerHTML = criarTabelaHtml(todosOsAlunos);
    } catch (erro) {
        console.error("Erro ao transcrever:", erro);
        document.getElementById("res-transcricao").textContent = "Algo deu errado. Tente novamente.";
    } finally {
        botao.disabled = false;
        botao.textContent = "Transcrever";
    }
});

document.getElementById("btn-gerar-feedbacks")
.addEventListener("click", async (evento) => {
    const tabela = document.querySelector("#res-transcricao table");
    if (!tabela) {
        alert("Nenhuma transcrição encontrada para gerar feedbacks.");
        return;
    }

    const botao = evento.target;
    botao.disabled = true;
    botao.textContent = "Gerando...";

    try {

        const alunos = Array.from(tabela.rows).slice(1).map(row => ({
            nome: row.cells[0].textContent.trim(),
            questao: row.cells[1].textContent.trim(),
            respostaAluno: row.cells[2].textContent.trim()
        }));

        const resposta = await fetch("/gerar-feedbacks", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                tema: document.getElementById("tema").value,
                conteudo: document.getElementById("conteudo").value,
                tabela: tabelaParaMarkdown(alunos)
            })
        });

        const dados = await resposta.json();
        if (!resposta.ok) {
            throw new Error(dados.erro || "Falha ao gerar feedbacks.");
        }
        const { feedbacks } = dados;
        const feedbacksContainer = document.querySelector(".feedbacks-gerados");
        feedbacksContainer.innerHTML = `
            <h2>Feedbacks</h2>
            <pre id="texto-feedbacks">${feedbacks}</pre>
            <button class="btn-copiar">Copiar tudo</button>
        `;
    } catch (erro) {
        console.error("Erro ao gerar feedbacks:", erro);
        document.querySelector(".feedbacks-gerados").innerHTML = "<h2>Feedbacks</h2><p>Algo deu errado. Tente novamente.</p>";
    } finally {
        botao.disabled = false;
        botao.textContent = "Gerar feedbacks";
    }
});

document.querySelector(".feedbacks-gerados")
.addEventListener("click", async (evento) => {
    if (!evento.target.classList.contains("btn-copiar")) {
        return;
    }
    const texto = document.getElementById("texto-feedbacks").textContent;
    await navigator.clipboard.writeText(texto);
    evento.target.textContent = "Copiado!";
    setTimeout(() => { evento.target.textContent = "Copiar tudo"; }, 1500);
});
   </script>
</body>
</html>
