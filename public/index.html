<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeWork-Analysys</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="cabecalho">
        <h1>Feedback atividades</h1>
        <h3>Envie as fotos das atividades</h3>
   </div>
   <div class="escopo-transcricao">
        <h4>Tema da atividade</h4>
        <input id="tema" type="text" placeholder="Digite o tema da atividade">
         <h4>Conteúdo cobrado</h4>
         <textarea id="conteudo" placeholder="Digite o conteúdo cobrado na atividade"></textarea>
         <h4>Fotos das atividades</h4>
        <input type="file" id="fotos" accept="image/*" multiple>
         <button id="btn-transcrever">Transcrever</button>
   </div>
   <div id="res-transcricao">

   </div>
   <div class="escopo-geracao">
        <h2>Confira a transcrição</h2>
        <h4>Corrija o que estiver errado antes de gerar os feedbacks.</h4>
         <button id="btn-gerar-feedbacks">Gerar feedbacks</button>
   </div>
   <div class="feedbacks-gerados">
        <h2>Feedbacks</h2>
   </div>
   <script>
        function redimensionarImagem(arquivo, larguraMaxima, alturaMaxima) {
  return new Promise ((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        let largura = img.width;
        let altura = img.height;

        if (largura > larguraMaxima || altura > alturaMaxima) {
          const proporcao = Math.min(larguraMaxima / largura, alturaMaxima / altura);
          largura *= proporcao;
          altura *= proporcao;
        }

        const canvas = document.createElement("canvas");
        canvas.width = largura;
        canvas.height = altura;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, largura, altura);
        resolve(canvas.toDataURL(arquivo.type));
      };
      img.src = event.target.result;
    };
    reader.onerror = (error) => reject(error);
    reader.readAsDataURL(arquivo);
  });
}
function criarTabelaHtml(dados) {
    const linhas = dados.map(aluno => `
        <tr>
            <td contenteditable="true">${aluno.nome}</td>
            <td contenteditable="true">${aluno.resposta}</td>
        </tr>
    `).join("");

    return `
        <table>
            <tr><th>Nome</th><th>Resposta</th></tr>
            ${linhas}
        </table>
    `;
}

document.getElementById("btn-transcrever")
.addEventListener("click", async () => {
    try {
        const arquivos = Array.from(document.getElementById("fotos").files);
        let resultadoFinal;

        for (let i = 0; i < arquivos.length; i++) {
            document.getElementById("res-transcricao").textContent = `Enviando ${i + 1} de ${arquivos.length}...`;

            const conteudo = await redimensionarImagem(arquivos[i], 800, 600);
            const reposta = await fetch("/transcrever", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    tema: document.getElementById("tema").value,
                    conteudo: document.getElementById("conteudo").value,
                    foto: {
                        nome: arquivos[i].name,
                        tipo: arquivos[i].type,
                        tamanho: arquivos[i].size,
                        conteudo: conteudo
                    }
                })
            });
            resultadoFinal = await reposta.json();
        }

        document.getElementById("res-transcricao").innerHTML = criarTabelaHtml(resultadoFinal);
    } catch (erro) {
        console.error("Erro ao transcrever:", erro);
        document.getElementById("res-transcricao").textContent = "Algo deu errado. Tente novamente.";
    }
});

document.getElementById("btn-gerar-feedbacks")
.addEventListener("click", async () => {
    try {
        const tabela = document.querySelector("#res-transcricao table");
        if (!tabela) {
            alert("Nenhuma transcrição encontrada para gerar feedbacks.");
            return;
        }

        const alunos = Array.from(tabela.rows).slice(1).map(row => ({
            nome: row.cells[0].textContent.trim(),
            resposta: row.cells[1].textContent.trim()
        }));

        const resposta = await fetch("/gerar-feedbacks", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ alunos })
        });

        const feedbacks = await resposta.json();
        const feedbacksContainer = document.querySelector(".feedbacks-gerados");
        feedbacksContainer.innerHTML = "<h2>Feedbacks</h2>" + feedbacks.map(f => `
            <div class="feedback-item">
                <p><strong>${f.nome}:</strong> ${f.feedback}</p>
                <button class="btn-copiar" data-feedback="${f.feedback}">Copiar</button>
            </div>
        `).join("");
    } catch (erro) {
        console.error("Erro ao gerar feedbacks:", erro);
        document.querySelector(".feedbacks-gerados").innerHTML = "<h2>Feedbacks</h2><p>Algo deu errado. Tente novamente.</p>";
    }
});

document.querySelector(".feedbacks-gerados")
.addEventListener("click", async (evento) => {
    if (!evento.target.classList.contains("btn-copiar")) {
        return;
    }
    const texto = evento.target.dataset.feedback;
    await navigator.clipboard.writeText(texto);
    evento.target.textContent = "Copiado!";
    setTimeout(() => { evento.target.textContent = "Copiar"; }, 1500);
});
   </script>
</body>
</html>
