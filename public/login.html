<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-login">
    <div class="login-card">
        <h1>Feedback atividades</h1>
        <h3>Entre para continuar</h3>
        <form id="form-login">
            <input type="text" id="usuario" placeholder="Usuário">
            <input type="password" id="senha" placeholder="Digite sua senha">
            <button type="submit">Entrar</button>
        </form>
        <p id="erro-login" class="erro-login" hidden>Usuário ou senha incorretos.</p>
    </div>
    <script>
        document.getElementById("form-login").addEventListener("submit", async function(event) {
            event.preventDefault();
            const usuario = document.getElementById("usuario").value;
            const senha = document.getElementById("senha").value;
            const erroLogin = document.getElementById("erro-login");

            const resposta = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ usuario, senha })
            });

            if (resposta.ok) {
                window.location.href = "/";
            } else {
                erroLogin.hidden = false;
                document.querySelector(".login-card").classList.remove("erro-shake");
                void document.querySelector(".login-card").offsetWidth;
                document.querySelector(".login-card").classList.add("erro-shake");
            }
        });
    </script>
</body>
</html>
